# yaml-language-server: $schema=conventions/development/repo/catalog/catalog.schema.json
# The wow2 catalog: every repository and app, one entry per product.
# Wheelhouse reads it from wow-two/wow-two-ws@main; .claude/repo-registry.md is generated from it.
# Rules: conventions/development/repo/catalog/catalog.md. Public file: no hosts, addresses, environments or secrets.
catalog: 1

orgs:
  - slug: wow-two
    url: https://github.com/wow-two
    label: core
    description: "core identity: vision, roadmap, standards, org-wide GitHub config"
    notes:
      - "Also under `workbench/wow-two/`: `wow-two-modular-library-analysis.md` — historical analysis, loose file awaiting a future home repo."
  - slug: wow-two-meta
    url: https://github.com/wow-two-meta
    label: off-ecosystem
    description: "docs adjacent to but not part of the wow-two ecosystem: personal career strategy, legacy archives"
  - slug: wow-two-platform
    url: https://github.com/wow-two-platform
    label: internal infra
    description: "pipelines, DI, comms, data access. Not for external consumers"
  - slug: wow-two-sdk
    url: https://github.com/wow-two-sdk
    label: public libs & tools
    description: "installable packages, tools, clients"
  - slug: wow-two-sdk-beta
    url: https://github.com/wow-two-sdk-beta
    label: beta SDK packages
    description: "beta-forever packages. Mirror of `wow-two-sdk` for unstable / iterating libs. Repos are **public** (Pages requirement on free tier) but Issues/Discussions disabled to keep contributor surface minimal"
  - slug: wow-two-kb
    url: https://github.com/wow-two-kb
    label: knowledge base
    description: "code samples, runnable demos, real-world docs"
  - slug: wow-two-apps
    url: https://github.com/wow-two-apps
    label: community products
    description: "no public repos yet"
    notes:
      - "> **Note**: Apps like Feedback.Analyzer, DDLParser, StudyMate etc. are still in the old `WoW-2-0-Projects` org and haven't been migrated yet."
  - slug: ocharo-hq
    url: https://github.com/ocharo-hq
    label: brand workspace
    description: "Ocharo's brand organization: platform, studio, marketing and assets, independent of WoW2"
    intro:
      - "Six main repositories plus the `.github` profile repository belong to Ocharo. Blog, Brand and Catalogue are adopted components, not additional repository targets. Current paths: [Ocharo repository map](../workbench/ocharo-hq/ocharo-ws/docs/repositories.md)."
      - |-
        - `workbench/ocharo-hq/ocharo-ws/` owns Ocharo setup and repository navigation.
        - Its Git history and GitHub organization remain independent of WoW2.
        - Its managed repositories sit directly under its own ignored `workbench/`.
        - Coding chats use the WoW2 root for existing shared hooks and engineering conventions.

workspaces:
  - slug: personal
    name: Personal
    description: "Personal tools and documents outside the ecosystem"
  - slug: wow2-platform
    name: wow2 platform
    description: "Platform apps that deploy and run the portfolio, and their test fixtures"
  - slug: wow2-backbone
    name: wow2 backbone
    description: "Building blocks: core docs, SDKs, platform libraries, pipelines, templates and the knowledge base"
  - slug: wow2-apps
    name: wow2 apps
    description: "Community apps built on the ecosystem"
  - slug: own-ventures
    name: Own ventures
    description: "The owner's product ventures"
  - slug: other-ventures
    name: Other ventures
    description: "Ventures and client work run for others"

